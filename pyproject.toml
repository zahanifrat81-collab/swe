[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwyrm-adaptive"
version = "0.3.0"
description = "Bookwyrm misconception probes and learning-transfer follow-ups"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
demo = ["uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["bookwyrm_adaptive*"]

[tool.setuptools.package-data]
bookwyrm_adaptive = ["demo_assets/*.html", "demo_assets/*.css", "demo_assets/*.js"]
